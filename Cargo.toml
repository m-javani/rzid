[package]
name = "rzid"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["tokio"] }
axum-server = { version = "0.8.0" }  # removed tls-rustls feature
clap = { version = "4.6", features = ["derive"] }
prometheus = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11.0"
serde_yaml = "0.9.34"
